
<body>
  <div id="intro-overlay">
    <!-- আপনার নিজের ছবি এখানে শো করবে -->
    <img src="my-photo.jpg" alt="Fahim Shahariyar Bhuyain" style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 3px solid #ff3333; margin-bottom: 20px;">
    
    <h2>Welcome. The man is coming.</h2>
    <p>Turn on the sound. You'll want to hear this.</p>
    
    <button class="sound-btn" onclick="startExperience()">🔊 Tap for sound</button>
</div>

    
    <!-- ব্যাকগ্রাউন্ড সাউন্ড -->
    <audio id="bg-audio" src="sound.mp3" loop></audio>

    <!-- মূল ওয়েবসাইট কন্টেন্ট -->
    <section>
        <h1>Welcome to My Website</h1>
        <p>Welcome to my personal website. This is my space to share my profile and projects.</p>
    </section>

    <!-- অ্যানিমেশন ও সাউন্ড কন্ট্রোল করার স্ক্রিপ্ট -->
    <script>
      function startExperience() {
          var audio = document.getElementById("bg-audio");
          if (audio) {
              audio.play().catch(function(error) {
                  console.log("Audio playback failed:", error);
              });
          }
          
          var overlay = document.getElementById("intro-overlay");
          overlay.style.opacity = "0";
          setTimeout(function() {
              overlay.style.display = "none";
          }, 800);
      }
    </script>
</body>
</html>
